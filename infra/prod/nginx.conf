# AzaadAwaaz web server (spec §10, §12).
#
# Serves the static web app (apps/web build) on every clearnet domain and, over
# unix sockets, to the Tor onion services. Also fronts the API, our relay
# (websocket) and our IPFS gateway on their own host names.
#
# Privacy (spec §12):
#   - access_log off everywhere; no log_format mentions $remote_addr.
#   - error_log at "emerg" only: lower levels include "client: <ip>" in each line.
#   - no realip module use; upstreams never receive the client address
#     (X-Forwarded-For / X-Real-IP are explicitly cleared).
#   - the container also runs with the `none` log driver.
#
# Web (spec §12): strict CSP with no inline scripts or styles, nosniff, correct
# media types, no referrer.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr emerg;

events {
    worker_connections 4096;
}

http {
    access_log off;
    log_not_found off;
    server_tokens off;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        application/vnd.android.package-archive apk;
        application/x-bittorrent torrent;
        text/markdown md;
    }
    default_type application/octet-stream;
    charset utf-8;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/markdown;

    # Docker's embedded DNS; resolving per request lets nginx start even when
    # an upstream is down and pick up restarted containers.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Rate limiting by client address happens in memory only (never logged).
    # The onion sockets all share one key ("onion"), so Tor's own PoW defence
    # is what protects them.
    map $remote_addr $limit_key {
        default  $binary_remote_addr;
        "unix:"  "onion";
    }
    limit_req_zone $limit_key zone=api:10m rate=10r/s;
    limit_req_status 429;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_certificate     /run/secrets/tls_fullchain;
    ssl_certificate_key /run/secrets/tls_privkey;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # ---------------------------------------------------------------- headers
    # Each server sets $csp and $hsts; azaad-headers.conf (included in every
    # location, because add_header does not inherit into locations that set
    # their own) sends them with the other security headers. An empty $hsts
    # sends no header (onion services).
    # Clearnet CSP. Media and data come from IPFS gateways and relays chosen at
    # run time from the signed lists (any https/wss origin); every fetched file
    # is verified by hash in the client. No inline script or style anywhere.
    map $host $csp_clearnet {
        default "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; upgrade-insecure-requests";
    }
    # Onion CSP: same, plus plain http/ws to other .onion services; no upgrade.
    map $host $csp_onion {
        default "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob: https: http://*.onion; media-src 'self' blob: https: http://*.onion; font-src 'self'; connect-src 'self' https: wss: http://*.onion ws://*.onion; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'";
    }

    # --------------------------------------------------------- HTTP -> HTTPS
    server {
        listen 80 default_server;
        server_name _;
        # Inherited by the locations below (none sets its own add_header).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        # ACME http-01 challenges, if the owner uses them.
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }
        # Container healthcheck.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------- the web app (TLS)
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        set $csp $csp_clearnet;
        set $hsts "max-age=63072000; includeSubDomains";
        include /etc/nginx/azaad-app.conf;
    }

    # ------------------------------------------- our relay (wss://relay.<domain>)
    server {
        listen 443 ssl;
        http2 off;
        server_name ~^relay\.;

        location / {
            set $relay_upstream http://relay:7777;
            proxy_pass $relay_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # NIP-11 JSON and the websocket upgrade only: nothing here may render or be framed.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
        }
    }

    # ------------------------------- our IPFS gateway (https://ipfs.<domain>)
    # Read-only path gateway; Kubo runs with Gateway.NoFetch so it serves only
    # what we pin. Pinned files are arbitrary bytes (an HTML or SVG file in a
    # CID would otherwise run script with this origin): every response is a
    # CSP sandbox (opaque origin, no scripts, forms, plugins or popups) with
    # default-src 'none' (it loads nothing), and nosniff keeps browsers from
    # guessing an executable type. The app only fetch()es from here and checks
    # every byte against its hash, which this policy does not affect.
    server {
        listen 443 ssl;
        http2 on;
        server_name ~^ipfs\.;

        location ~ ^/(ipfs|ipns)/ {
            limit_except GET HEAD { deny all; }
            set $ipfs_upstream http://ipfs:8080;
            proxy_pass $ipfs_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-Proto https;
            # Only our policy, never one from upstream.
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "sandbox; default-src 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
        }
        location / {
            add_header Content-Security-Policy "sandbox; default-src 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Referrer-Policy "no-referrer" always;
            return 404;
        }
    }

    # --------------------------------------- onion: public web (Tor socket)
    server {
        listen unix:/run/onion/web.sock;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        set $csp $csp_onion;
        set $hsts "";
        include /etc/nginx/azaad-app.conf;
    }

    # ---------------------------- onion: moderator area (separate onion)
    # Same app and API; reachable only through the moderator onion, which uses
    # Tor client authorisation (see torrc).
    server {
        listen unix:/run/onion/mod.sock;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        set $csp $csp_onion;
        set $hsts "";
        include /etc/nginx/azaad-app.conf;
    }
}
