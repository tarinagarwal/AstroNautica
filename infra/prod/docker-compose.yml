# AzaadAwaaz production stack for one host (spec §10, §11, §12).
#
# NOT DEPLOYED from here automatically. Each production host runs this file
# (two or more hosts, in different countries and with different providers);
# relay, ipfs and onion are what get repeated across hosts.
#
#   cd infra/prod
#   cp .env.example .env            # edit
#   ./secrets/README.md             # create the secret files listed there
#   docker compose up -d --build
#
# Networks (all but edge and egress are `internal: true`, i.e. no internet):
#   edge     - reachable from the internet through published ports (web, seedbox, ipfs swarm, relay)
#   backend  - postgres, migrate, api, publisher, relay, seedbox RPC, web (proxy to api/relay)
#   ipfsrpc  - Kubo's RPC API (port 5001, full control of the node), shared ONLY by ipfs and the
#              publisher. Kubo binds the RPC to its fixed address on this network (and 127.0.0.1 for
#              the healthcheck), so it is not reachable from any other network either.
#   ipfsgw   - Kubo's read-only gateway (8080), shared by ipfs and web (https://ipfs.<domain>)
#   mediabus - the media worker, shared ONLY by media and the publisher: media has no internet, no
#              database, no secrets
#   egress   - outbound internet for the publisher (Arweave, EVM RPCs, other relays) and Tor
#
# Database users (least privilege, services/api migration 004 + postgres/init-users.sh):
#   azaad      - database owner; used only by the one-shot `migrate` service
#   api        - member of azaad_api_role
#   publisher  - member of azaad_publisher_role
#
# Privacy (spec §12): no service logs client addresses. web and relay are also
# run with the `none` log driver; the seedbox too, because its peers are readers.

name: azaadawaaz

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-no-logs: &no-logs
  logging:
    driver: none

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  postgres_api_password: { file: ./secrets/postgres_api_password }
  postgres_publisher_password: { file: ./secrets/postgres_publisher_password }
  publisher_nostr_key: { file: ./secrets/publisher_nostr_key }
  publisher_x25519_key: { file: ./secrets/publisher_x25519_key }
  arweave_wallet: { file: ./secrets/arweave_wallet.json }
  evm_private_key: { file: ./secrets/evm_private_key }
  seedbox_rpc_password: { file: ./secrets/seedbox_rpc_password }
  pinning_services: { file: ./secrets/pinning_services.json }
  tls_fullchain: { file: ./secrets/tls_fullchain.pem }
  tls_privkey: { file: ./secrets/tls_privkey.pem }

networks:
  edge:
  backend:
    internal: true
  ipfsrpc:
    internal: true
    ipam:
      config:
        - subnet: ${IPFS_RPC_SUBNET:-172.31.250.0/29}
  ipfsgw:
    internal: true
  mediabus:
    internal: true
  egress:

volumes:
  postgres-data:
  staging: # encrypted submission blobs (api writes, publisher reads)
  seed: # published video files (complete/), shared with the seedbox
  seed-watch: # .torrent files the publisher drops for the seedbox to pick up
  media-work: # decrypted, approved media while it is processed (publisher <-> media worker; deleted after publishing)
  relay-db:
  ipfs-data:
  seedbox-config:
  onion-keys: # Tor onion service keys - BACK UP ENCRYPTED, IN TWO PLACES
  onion-sockets: # unix sockets between web (nginx) and onion (tor)
  acme:

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    networks: [backend]
    environment:
      POSTGRES_DB: azaadawaaz
      POSTGRES_USER: azaad
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # init-users.sh (first start only; re-run by hand on existing databases, see README) creates the
    # LOGIN users `api` and `publisher` from these secrets.
    secrets: [postgres_password, postgres_api_password, postgres_publisher_password]
    command:
      [
        "postgres",
        "-c",
        "log_connections=off",
        "-c",
        "log_disconnections=off",
        "-c",
        "log_hostname=off",
        "-c",
        "password_encryption=scram-sha-256",
      ]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-users.sh:/docker-entrypoint-initdb.d/10-azaad-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azaad -d azaadawaaz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: applies services/api/migrations as the database owner, then exits. api and
  # publisher start only after it succeeded and never hold DDL rights themselves.
  migrate:
    <<: *hardening
    restart: "no"
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: azaadawaaz/api:${RELEASE:-latest}
    command: ["node", "dist/migrate.js"]
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      OWNER_PUBKEY: ${OWNER_PUBKEY:?set OWNER_PUBKEY in .env}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: azaadawaaz
      DATABASE_USER: azaad
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      STAGING_DIR: /var/lib/azaadawaaz/staging
    secrets: [postgres_password]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *hardening
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: azaadawaaz/api:${RELEASE:-latest}
    # backend only: postgres and the relay. No route to Kubo's RPC (ipfsrpc) or the media worker.
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # Every door clients use to reach the API (NIP-98 binds signatures to the URL); same path on all of them.
      PUBLIC_URL: ${API_PUBLIC_URLS:?set API_PUBLIC_URLS in .env, e.g. https://azaadawaaz.org/api,http://<onion>/api}
      ALLOWED_ORIGINS: ${WEB_ORIGINS:?set WEB_ORIGINS in .env}
      OWNER_PUBKEY: ${OWNER_PUBKEY:?set OWNER_PUBKEY in .env}
      RELAYS: ws://relay:7777${EXTRA_RELAYS:+,${EXTRA_RELAYS}}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: azaadawaaz
      DATABASE_USER: api
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_api_password
      # Migrations run in the one-shot `migrate` service; the api user has no DDL rights.
      AUTO_MIGRATE: "false"
      STAGING_DIR: /var/lib/azaadawaaz/staging
      # Staging quotas and draft expiry (services/api/README.md).
      MAX_SUBMISSION_BYTES: ${MAX_SUBMISSION_BYTES:-4GB}
      MAX_CONTRIBUTOR_STAGING_BYTES: ${MAX_CONTRIBUTOR_STAGING_BYTES:-8GB}
      MAX_MEDIA_PER_SUBMISSION: ${MAX_MEDIA_PER_SUBMISSION:-200}
      DRAFT_RETENTION_DAYS: ${DRAFT_RETENTION_DAYS:-30}
      # The api never sees client addresses (nginx strips them); do not add a
      # trust-proxy setting that would bring them back.
      TRUST_PROXY: "false"
    secrets: [postgres_api_password]
    volumes: ["staging:/var/lib/azaadawaaz/staging"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Fixes the ownership of the volumes the unprivileged (uid 1000) publisher and media worker write
  # to; Docker creates new named volumes root-owned. One-shot, no network.
  volume-perms:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    command: ["sh", "-c", "chown 1000:1000 /v/media-work /v/seed /v/seed-watch && chmod 0700 /v/media-work"]
    volumes:
      - media-work:/v/media-work
      - seed:/v/seed
      - seed-watch:/v/seed-watch

  # The media worker (services/media `node dist/server.js`, threat model §7): ffmpeg and sharp parse
  # untrusted files here, never in the publisher. Only on `mediabus` (internal, shared with the
  # publisher alone): no internet, no database, no secrets, no other service. Non-root, read-only root,
  # no capabilities, bounded memory and processes. It sees only the shared media-work volume.
  media:
    <<: *hardening
    build:
      context: ../..
      dockerfile: services/media/Dockerfile
    image: azaadawaaz/media:${RELEASE:-latest}
    user: "1000:1000"
    networks: [mediabus]
    read_only: true
    tmpfs: ["/tmp:size=4g"]
    cap_drop: [ALL]
    mem_limit: ${MEDIA_MEM_LIMIT:-4g}
    pids_limit: 256
    environment:
      NODE_ENV: production
      MEDIA_PORT: "3001"
      MEDIA_SHARED_DIR: /var/lib/azaadawaaz/media
    volumes: ["media-work:/var/lib/azaadawaaz/media"]
    depends_on:
      volume-perms: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # The only holder of the publisher key (spec §12). Rotate by replacing the
  # secret file and `docker compose up -d publisher`.
  publisher:
    <<: *hardening
    build:
      context: ../..
      dockerfile: services/publisher/Dockerfile
    image: azaadawaaz/publisher:${RELEASE:-latest}
    # backend: postgres + relay; ipfsrpc: Kubo RPC; mediabus: the media worker; egress: the internet.
    networks: [backend, ipfsrpc, mediabus, egress]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      OWNER_PUBKEY: ${OWNER_PUBKEY:?set OWNER_PUBKEY in .env}
      DATABASE_HOST: postgres
      DATABASE_NAME: azaadawaaz
      DATABASE_USER: publisher
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_publisher_password
      # Secrets (see services/publisher/README.md); files hold the bare value, no trailing newline needed.
      PUBLISHER_NSEC_FILE: /run/secrets/publisher_nostr_key
      PUBLISHER_X25519_PRIVATE_FILE: /run/secrets/publisher_x25519_key
      PUBLISHER_EVM_KEY_FILE: /run/secrets/evm_private_key
      PINNING_SERVICES_FILE: /run/secrets/pinning_services
      ARWEAVE_JWK: /run/secrets/arweave_wallet
      ARWEAVE_URL: ${ARWEAVE_URL:-https://arweave.net}
      ARWEAVE_DEV_MINE: "false"
      ARWEAVE_MAX_VIDEO_BYTES: ${ARWEAVE_MAX_VIDEO_BYTES:-0}
      # JSON: [{"key":"base","chainId":8453,"rpc":"https://...","registry":"0x..."},{"key":"bsc","chainId":56,...}]
      CHAINS: ${CHAINS_JSON:?set CHAINS_JSON in .env (decisions.md D7)}
      # Our local relay first, then the other relays from the signed list.
      RELAYS: ws://relay:7777${EXTRA_RELAYS:+,${EXTRA_RELAYS}}
      REQUIRED_RELAY_SUCCESSES: ${REQUIRED_RELAY_SUCCESSES:-3}
      # At least two Kubo nodes in different countries (spec §6 step 3): this host's and another host's.
      IPFS_APIS: http://ipfs:5001${EXTRA_IPFS_API_URLS:+,${EXTRA_IPFS_API_URLS}}
      IPFS_GATEWAYS: ${PUBLIC_IPFS_GATEWAYS:?set PUBLIC_IPFS_GATEWAYS in .env}
      STAGING_DIR: /var/lib/azaadawaaz/staging
      # Images and videos are processed by the media worker over mediabus; decrypted media is
      # handed over through the shared media-work volume (also the publisher's work dir).
      MEDIA_URL: http://media:3001
      MEDIA_SHARED_DIR: /var/lib/azaadawaaz/media
      # Transmission seeds from /downloads/complete (the `seed` volume) and watches /watch (`seed-watch`).
      SEED_DIR: /var/lib/azaadawaaz/seed/complete
      SEEDBOX_WATCH_DIR: /var/lib/azaadawaaz/seed/watch
    secrets:
      - postgres_publisher_password
      - publisher_nostr_key
      - publisher_x25519_key
      - arweave_wallet
      - evm_private_key
      - pinning_services
    volumes:
      - staging:/var/lib/azaadawaaz/staging:ro
      - media-work:/var/lib/azaadawaaz/media
      - seed:/var/lib/azaadawaaz/seed
      - seed-watch:/var/lib/azaadawaaz/seed/watch
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      volume-perms: { condition: service_completed_successfully }
      relay: { condition: service_healthy }
      ipfs: { condition: service_healthy }
      media: { condition: service_healthy }

  relay:
    <<: [*no-logs, *hardening]
    build:
      context: ../relay
    image: azaadawaaz/relay:${RELEASE:-latest}
    networks: [backend, edge]
    environment:
      # Write policy allowlist (infra/relay/policy.js): stories, lists and audit events only from the
      # owner and the moderator/publisher keys the owner's own lists name; no deletions.
      OWNER_PUBKEY: ${OWNER_PUBKEY:?set OWNER_PUBKEY in .env}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-16}
      RATE_COMMENTS_PER_MINUTE: ${RATE_COMMENTS_PER_MINUTE:-10}
      RATE_REACTIONS_PER_MINUTE: ${RATE_REACTIONS_PER_MINUTE:-60}
      MAX_COMMENT_CHARS: ${MAX_COMMENT_CHARS:-2000}
    ulimits:
      nofile: { soft: 524288, hard: 524288 }
    volumes: ["relay-db:/app/strfry-db"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Accept: application/nostr+json", "http://localhost:7777/"]
      interval: 60s
      start_period: 60s
      start_interval: 2s
      timeout: 5s
      retries: 3

  ipfs:
    <<: *hardening
    image: ipfs/kubo:v0.38.1
    command: ["daemon", "--migrate=true", "--enable-gc"]
    # Not on backend: the api must not reach Kubo's RPC. edge: swarm; ipfsgw: gateway for web;
    # ipfsrpc: RPC for the publisher, on a fixed address the RPC listener is bound to.
    networks:
      edge: {}
      ipfsgw: {}
      ipfsrpc:
        ipv4_address: ${IPFS_RPC_IP:-172.31.250.2}
    environment:
      IPFS_PROFILE: server
      IPFS_STORAGE_MAX: ${IPFS_STORAGE_MAX:-500GB}
      IPFS_PEERING: ${IPFS_PEERING:-}
      # Addresses.API (ipfs/001-azaad-prod.sh): loopback for the healthcheck + the ipfsrpc address.
      IPFS_API_LISTEN: /ip4/127.0.0.1/tcp/5001,/ip4/${IPFS_RPC_IP:-172.31.250.2}/tcp/5001
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
    volumes:
      - ipfs-data:/data/ipfs
      - ./ipfs/001-azaad-prod.sh:/container-init.d/001-azaad-prod.sh:ro
    healthcheck:
      test: ["CMD", "ipfs", "--api=/ip4/127.0.0.1/tcp/5001", "id"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Seeds video torrents (spec §11). The publisher writes finished files to
  # seed/complete/ and the matching .torrent to seed/watch/; Transmission
  # picks the .torrent up, finds the data already in place, verifies it and
  # seeds. RPC (9091) is reachable only on the backend network.
  seedbox:
    <<: [*no-logs, *hardening]
    image: linuxserver/transmission:4.0.6
    networks: [backend, edge]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      USER: azaad
      FILE__PASS: /run/secrets/seedbox_rpc_password
      PEERPORT: "51413"
      # RPC only from the backend network (docker's private ranges).
      WHITELIST: "127.0.0.1,172.*.*.*,10.*.*.*,192.168.*.*"
      HOST_WHITELIST: "seedbox"
    secrets: [seedbox_rpc_password]
    ports:
      - "51413:51413/tcp"
      - "51413:51413/udp"
    volumes:
      - seedbox-config:/config
      - seed:/downloads # Transmission's download-dir is /downloads/complete
      - seed-watch:/watch

  web:
    <<: [*no-logs, *hardening]
    build:
      context: ../..
      dockerfile: infra/prod/web.Dockerfile
    image: azaadawaaz/web:${RELEASE:-latest}
    # backend: api + relay; ipfsgw: the read-only IPFS gateway (never the RPC).
    networks: [edge, backend, ipfsgw]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx"]
    ports:
      - "80:80"
      - "443:443"
    secrets: [tls_fullchain, tls_privkey]
    volumes:
      - onion-sockets:/run/onion
      - acme:/var/www/acme:ro
    depends_on: [api, relay, ipfs]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Tor v3 onion services in front of web: public site + moderator area
  # (torrc). Tor's proof-of-work DoS defence is on. Needs only outbound
  # internet to reach the Tor network; no published ports.
  onion:
    <<: [*no-logs, *hardening]
    image: osminogin/tor-simple:0.4.9.14
    networks: [egress]
    command: ["tor", "-f", "/etc/tor/torrc"]
    volumes:
      - ./torrc:/etc/tor/torrc:ro
      - onion-keys:/var/lib/tor
      - onion-sockets:/run/onion
    depends_on: [web]
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/tor/hs_web/hostname && test -s /var/lib/tor/hs_mod/hostname"]
      interval: 60s
      timeout: 5s
      retries: 3
