# The static web app plus the API, shared by the clearnet and onion servers
# (included from nginx.conf).

# Hidden files are never served, except /.well-known/.
location ~ /\.(?!well-known/) {
    include /etc/nginx/azaad-headers.conf;
    return 404;
}

# Content-hashed build output (Vite emits /assets/<name>-<hash>.<ext>).
location /assets/ {
    include /etc/nginx/azaad-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# The API (services/api). Submissions carry encrypted media, so bodies may be
# large; they are streamed, not buffered to disk.
location /api/ {
    limit_req zone=api burst=40 nodelay;
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    include /etc/nginx/azaad-headers.conf;
    add_header Cache-Control "no-store" always;
}

# Single-page app: unknown paths get index.html, which is never cached so a
# new release is picked up immediately.
location / {
    include /etc/nginx/azaad-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
