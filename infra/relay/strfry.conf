##
## AzaadAwaaz strfry configuration (spec §7, §11, §12)
##
## Differences from the strfry defaults:
##   - events.maxEventSize raised to 512 KiB so long-form stories (kind 30023),
##     manifests and storage receipts (kind 30078) fit with room to spare;
##     websocket payload raised to match.
##   - writePolicy.plugin runs the AzaadAwaaz policy (NIP-13 PoW + per-pubkey
##     rate limits + comment length on kinds 1111 and 7). Configure it through
##     the container environment: POW_DIFFICULTY, RATE_COMMENTS_PER_MINUTE,
##     RATE_REACTIONS_PER_MINUTE, MAX_COMMENT_CHARS.
##   - No IP logging where strfry allows it: realIpHeader is empty (we never ask
##     a proxy for the client address), all message dumps are off and invalid
##     event logging is off (it includes connection details). The one thing
##     strfry always prints, the connect line, is scrubbed by the entrypoint.
##   - nofiles = 0: the container runtime sets the open-files limit (ulimits in
##     compose) instead of strfry trying to raise it.
##

db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    # Maximum size of normalised JSON, in bytes (512 KiB)
    maxEventSize = 524288

    rejectEventsNewerThanSeconds = 900
    # Old events must still be accepted: the archive can be re-published from
    # IPFS/Arweave by the rebuild script and by mirrors (about 30 years).
    rejectEventsOlderThanSeconds = 946080000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0

    # Never trust or record a forwarded client address.
    realIpHeader = ""

    auth {
        enabled = false
        serviceUrl = ""
        restrictedReadKinds = ""
        restrictReadToInvolvedPubkey = false
    }

    info {
        name = "AzaadAwaaz relay"
        description = "Relay for AzaadAwaaz stories, comments and reactions. Comments (kind 1111) and reactions (kind 7) need NIP-13 proof-of-work and are rate limited per key. No IP addresses are logged."
        pubkey = ""
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""
    }

    # Must be larger than maxEventSize (1 MiB)
    maxWebsocketPayloadSize = 1048576

    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxTagsPerFilter = 3
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200
    maxPendingOutboundBytes = 33554432

    writePolicy {
        plugin = "/app/azaad-policy.js"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = false
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }

    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
