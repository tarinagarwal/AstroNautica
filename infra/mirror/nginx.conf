# AzaadAwaaz mirror: serves the static web app that mirror-sync exports from
# IPFS into /srv/web (spec §10). Read-only: no API, no uploads.
#
# Privacy (spec §12): no access log, error log at "emerg" only (lower levels
# include client addresses), container runs with the `none` log driver.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr emerg;

events {
    worker_connections 2048;
}

http {
    access_log off;
    log_not_found off;
    server_tokens off;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        application/vnd.android.package-archive apk;
        text/markdown md;
    }
    default_type application/octet-stream;
    charset utf-8;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1k;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/markdown;

    # Mirrors may be served over plain HTTP behind the operator's own TLS
    # terminator or Tor, so no upgrade-insecure-requests here.
    map $host $csp {
        default "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https: http://*.onion; media-src 'self' blob: https: http://*.onion; font-src 'self'; connect-src 'self' https: wss: http://*.onion ws://*.onion; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'";
    }
    map $host $hsts {
        default "";
    }

    server {
        listen 80 default_server;
        listen unix:/run/onion/web.sock;
        server_name _;
        root /srv/web/current;
        index index.html;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ /\.(?!well-known/) {
            return 404;
        }

        location /assets/ {
            include /etc/nginx/azaad-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location /api/ {
            return 404;
        }

        location / {
            include /etc/nginx/azaad-headers.conf;
            add_header Cache-Control "no-cache" always;
            # 503 until mirror-sync has exported the first build.
            try_files $uri $uri/ /index.html =503;
        }
    }
}
