[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# "paris" avoids PUSH0 / MCOPY / transient storage so the identical bytecode deploys on every EVM chain we may add.
evm_version = "paris"
optimizer = true
optimizer_runs = 10000
bytecode_hash = "ipfs"
cbor_metadata = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = ["forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 64

[profile.ci.fuzz]
runs = 10000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
local = "${LOCAL_RPC_URL}"
base = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"
bsc = "https://bsc-dataseed.bnbchain.org"
bsc_testnet = "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
